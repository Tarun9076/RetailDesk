<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b6b47">
  <title>Offline · RetailDesk</title>
  <!--
    Plain HTML on purpose. The service worker shows this file when a page cannot be
    loaded, under whatever address the shopkeeper asked for. A framework page would
    try to "fix" the address mismatch and reload in a loop; a static file cannot.
  -->
  <style>
    :root { --ink: #15211b; --muted: #5f6d66; --accent: #1b6b47; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 24px; text-align: center; color: var(--ink); background: #fff;
      font-family: "Noto Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    svg { color: var(--muted); }
    h1 { margin: 20px 0 0; font-size: 24px; letter-spacing: -0.01em; }
    h2 { margin: 32px 0 0; font-size: 20px; }
    p { margin: 8px 0 0; max-width: 20rem; line-height: 1.5; color: var(--muted); }
    a {
      display: inline-flex; align-items: center; justify-content: center; min-height: 56px; margin-top: 32px;
      padding: 0 32px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 16px;
      font-weight: 500; text-decoration: none;
    }
  </style>
</head>
<body>
  <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/>
    <path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/>
    <path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/>
  </svg>
  <h1>You are offline</h1>
  <p>No signal right now. Your cart is saved on this phone. Connect again to place your order.</p>
  <h2 lang="hi">आप ऑफ़लाइन हैं</h2>
  <p lang="hi">अभी सिग्नल नहीं है। आपका कार्ट इस फ़ोन में सुरक्षित है। ऑर्डर देने के लिए फिर से जुड़ें।</p>
  <a href="/">Try again / फिर कोशिश करें</a>
</body>
</html>
